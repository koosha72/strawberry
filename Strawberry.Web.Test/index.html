<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="modulepreload" href="./main.js" />
    <link rel="modulepreload" href="./_framework/dotnet.js" />
    <title>Strawberry Web platform test</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            overflow: hidden;
        }

        canvas#canvas {
            width: 1280px;
            height: 720px;
            outline: none;
            margin: 0;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .loading {
            position: fixed;
            left: 0px;
            top: 0px;
            width: 100%;
            height: 100%;
            z-index: 9999999999;
            overflow: hidden;
            background-color: gray;
            opacity: 0.5;
            display: none;
        }

        .loader {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: orange;
            font-weight: bold;
            opacity: 1;
        }

        /* @media (min-aspect-ratio: 16/9) {
            canvas#canvas {
                height: 100vh;
                width: calc(100vh * (16 / 9));
            }
        }

        @media (max-aspect-ratio: 4/3) {
            canvas#canvas {
                width: 100vw;
                height: calc(100vw / (4 / 3));
            }
        } */
    </style>
</head>

<body>
    <button id="start">Start</button>
    <div class="loading" id="loading">
        <div class="loader">در حال بارگیری</div>
    </div>
    <canvas id="canvas" width="1280" height="720">
    </canvas>

    <script type="module" src="./main.js"></script>
</body>

</html>
